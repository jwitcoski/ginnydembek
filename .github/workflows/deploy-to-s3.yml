name: Deploy to S3 and CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (static export)
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create S3 bucket if it doesn't exist
        run: |
          if ! aws s3api head-bucket --bucket ginnydembek 2>/dev/null; then
            aws s3 mb s3://ginnydembek --region us-east-1
            echo "Bucket created successfully"
          else
            echo "Bucket already exists"
          fi

      - name: Configure S3 bucket for CloudFront access
        run: |
          DIST_ARN=$(aws cloudfront get-distribution --id E38F9PVDPMHRQK --query 'Distribution.ARN' --output text)
          echo "CloudFront Distribution ARN: $DIST_ARN"
          
          ORIGIN_ACCESS=$(aws cloudfront get-distribution --id E38F9PVDPMHRQK --query 'Distribution.DistributionConfig.Origins.Items[0].OriginAccessControlId' --output text 2>/dev/null || echo "None")
          if [ "$ORIGIN_ACCESS" = "None" ] || [ -z "$ORIGIN_ACCESS" ]; then
            echo "::warning::CloudFront origin does not have Origin Access Control (OAC) configured!"
          else
            echo "Origin Access Control ID: $ORIGIN_ACCESS"
          fi
          
          cat > /tmp/bucket-policy.json <<EOF
          {
            "Version": "2008-10-17",
            "Id": "PolicyForCloudFrontPrivateContent",
            "Statement": [
              {
                "Sid": "AllowCloudFrontServicePrincipal",
                "Effect": "Allow",
                "Principal": {
                  "Service": "cloudfront.amazonaws.com"
                },
                "Action": "s3:GetObject",
                "Resource": "arn:aws:s3:::ginnydembek/*",
                "Condition": {
                  "StringEquals": {
                    "AWS:SourceArn": "$DIST_ARN"
                  }
                }
              }
            ]
          }
          EOF
          
          aws s3api put-bucket-policy --bucket ginnydembek --policy file:///tmp/bucket-policy.json
          
          aws s3api put-public-access-block \
            --bucket ginnydembek \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          
          echo "Bucket configured for CloudFront access"

      - name: Deploy to S3
        run: |
          aws s3 sync out/ s3://ginnydembek --delete

      - name: Configure CloudFront rewrite for extensionless Next routes
        run: |
          set -euo pipefail
          DIST_ID="E38F9PVDPMHRQK"
          FUNCTION_NAME="ginnydembek-static-html-rewrite"

          cat > /tmp/cf-function.js <<'EOF'
          function handler(event) {
            var request = event.request;
            var uri = request.uri;
            if (uri === "/") {
              return request;
            }
            if (uri.indexOf(".") !== -1) {
              return request;
            }
            if (uri.endsWith("/")) {
              request.uri = uri.replace(/\/$/, "") + ".html";
            } else {
              request.uri = uri + ".html";
            }
            return request;
          }
          EOF

          # Strip leading indentation from heredoc for valid JS
          sed -i 's/^          //' /tmp/cf-function.js

          EXISTING_ETAG=$(aws cloudfront describe-function --name "$FUNCTION_NAME" --query 'ETag' --output text 2>/dev/null || true)
          if [ -z "${EXISTING_ETAG}" ] || [ "${EXISTING_ETAG}" = "None" ]; then
            aws cloudfront create-function \
              --name "$FUNCTION_NAME" \
              --function-config '{"Comment":"Rewrite /resume to /resume.html for Next static export","Runtime":"cloudfront-js-2.0"}' \
              --function-code "fileb:///tmp/cf-function.js"
          else
            aws cloudfront update-function \
              --name "$FUNCTION_NAME" \
              --if-match "$EXISTING_ETAG" \
              --function-config '{"Comment":"Rewrite /resume to /resume.html for Next static export","Runtime":"cloudfront-js-2.0"}' \
              --function-code "fileb:///tmp/cf-function.js"
          fi

          PUBLISH_ETAG=$(aws cloudfront describe-function --name "$FUNCTION_NAME" --query 'ETag' --output text)
          aws cloudfront publish-function --name "$FUNCTION_NAME" --if-match "$PUBLISH_ETAG"

          FN_ARN=$(aws cloudfront describe-function --name "$FUNCTION_NAME" --query 'FunctionSummary.FunctionMetadata.FunctionARN' --output text)
          echo "Function ARN: $FN_ARN"

          aws cloudfront get-distribution-config --id "$DIST_ID" > /tmp/dist.json
          ETAG=$(jq -r '.ETag' /tmp/dist.json)
          jq --arg arn "$FN_ARN" '
            .DistributionConfig
            | .DefaultCacheBehavior.FunctionAssociations = {
                "Quantity": 1,
                "Items": [
                  {
                    "FunctionARN": $arn,
                    "EventType": "viewer-request"
                  }
                ]
              }
          ' /tmp/dist.json > /tmp/dist-config.json

          aws cloudfront update-distribution \
            --id "$DIST_ID" \
            --if-match "$ETAG" \
            --distribution-config file:///tmp/dist-config.json

          echo "CloudFront viewer-request rewrite associated"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id E38F9PVDPMHRQK --paths "/*"
